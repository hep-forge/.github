# Upstream version sources that override what hep-bot derives from each
# recipe's own source URL (scripts/hep_bot/check_versions.py). Only list a
# package here when the automatic detection gets it wrong.
#   html_scrape: url + pattern (regex, one group = version; several
#                groups are joined with dots)
#   git_tags:    url (git repo) + pattern (regex on tag names) or prefix
#   github_releases: repo (owner/name)
#   anti_bot:    url only -- the site serves browsers only (anti-bot page);
#                hep-bot doesn't query it and lists the package for a human
#   conda_forge: package (+ optional pattern) -- the recipe only points at a
#                conda-forge package; follow that package's versions and bump
#                without downloading anything

fastjet:
  type: html_scrape
  url: "https://fastjet.fr/repo/"
  pattern: 'fastjet-(\d+\.\d+\.\d+)\.tar\.gz'

fastjet-contrib:
  type: html_scrape
  url: "http://fastjet.hepforge.org/contrib/downloads/"
  pattern: 'fjcontrib-(\d+\.\d+)\.tar\.gz'

rivet:
  type: html_scrape
  url: "https://rivet.hepforge.org/downloads/"
  pattern: 'Rivet-(\d+\.\d+\.\d+)\.tar\.gz'

lhapdf:
  type: html_scrape
  url: "https://lhapdf.hepforge.org/downloads/"
  pattern: 'LHAPDF-(\d+\.\d+\.\d+)\.tar\.gz'

hepmc:
  type: git_tags
  url: "https://gitlab.cern.ch/hepmc/HepMC3"
  pattern: '(\d+\.\d+\.\d+)'

# main's pythia (major 8) points at conda-forge's pythia8: follow that, not
# Pythia's own releases, which reach conda-forge later (8.312 -> 8.3.12).
pythia:
  type: conda_forge
  package: pythia8
  pattern: '(\d+)\.(\d)(\d\d)'

# main's geant points at conda-forge's geant4 (version spelled the same)
geant:
  type: conda_forge
  package: geant4

yoda:
  type: html_scrape
  url: "https://yoda.hepforge.org/downloads/"
  pattern: 'YODA-(\d+\.\d+\.\d+)\.tar\.gz'

applgrid:
  type: html_scrape
  url: "https://applgrid.hepforge.org/downloads/"
  pattern: 'applgrid-(\d+\.\d+\.\d+)\.tgz'

matrix:
  type: anti_bot
  url: "https://matrix.hepforge.org/download.html"

gaudi:
  type: git_tags
  url: "https://gitlab.cern.ch/gaudi/Gaudi"
  pattern: 'v(\d+)r(\d+)'

mg5amcnlo:
  type: html_scrape
  url: "https://launchpad.net/mg5amcnlo/+download"
  pattern: 'MG5_aMC_v(\d+\.\d+\.\d+)\.tar\.gz'
