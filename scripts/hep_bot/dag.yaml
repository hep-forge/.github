# Dependency graph for hep-forge feedstocks.
# auto_update: false means hep-bot never bumps this package automatically.
#
# depends_on lists are derived from each feedstock's own recipe/meta.yaml
# requirements (host/run/build). ROOT is conda-forge's root_base (not a
# hep-forge package since the conda-forge-root migration), so it is not a
# node here.
#
# Ordered so every package comes after its dependencies: hep-bot's version
# check walks it top to bottom. Every build/host/run requirement that names
# another hep-forge package is an edge; packages with neither dependencies
# nor dependents are left out (the version check takes them after these).

fastjet:
  depends_on: []

fastjet-contrib:
  depends_on: [fastjet]

lhapdf:
  depends_on: []

yoda:
  depends_on: []

hoppet:
  depends_on: [lhapdf]

