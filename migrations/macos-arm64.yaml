# Publish osx-arm64 builds of every package that builds there.
# Each repo builds and publishes macOS only (ANACONDA_COMPILE/PUBLISH=macos-arm64)
# until its newest tag passes; then ANACONDA_PUBLISH=amd64,arm64,macos-arm64.
name: macos-arm64
created: 2026-11-03T02:37:00Z
platform: macos-arm64
packages: all
max_running: 8
exclude: [helloworld]   # template test package
# Published broken on macOS (Python module linked GCC's libstdc++ next to
# libc++ and segfaulted); rebuild with lhapdf-feedstock's fix.
redo:
  lhapdf: 2026-11-03T10:50:00Z
  # macOS package held only rootIO (conda-forge's hepmc3 was already in the
  # host env); rebuilt depending on hepmc3
  hepmc: 2026-11-06T05:12:00Z
  # podioConfig recorded the build env's python 3.14; rebuilt against 3.12
  podio: 2026-11-06T05:12:00Z
  # linked with a global -undefined dynamic_lookup; rebuilt with the libtool fix
  thepeg: 2026-11-03T20:45:00Z
  # linked libintl 1.x, which the stack's libintl < 1.0 rules out (xfitter)
  numdiff: 2026-11-04T09:50:00Z
  # built against conda-forge's ROOT; hep-forge builds ROOT for macOS now
  # (6.38/6.40, root-guard 2 keeps conda-forge's out), so rebuilt on it
  acts: 2026-11-06T05:12:00Z
  afterburner: 2026-11-06T05:12:00Z
  apfelgrid: 2026-11-06T05:12:00Z
  applgrid: 2026-11-06T05:12:00Z
