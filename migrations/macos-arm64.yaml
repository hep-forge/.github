# Publish osx-arm64 builds of every package that builds there.
# Each repo builds and publishes macOS only (ANACONDA_COMPILE/PUBLISH=macos-arm64)
# until its newest tag passes; then ANACONDA_PUBLISH=amd64,arm64,macos-arm64.
name: macos-arm64
created: 2026-11-03T02:37:00Z
platform: macos-arm64
packages: all
max_running: 8
exclude: [helloworld]   # template test package
# Published broken on macOS (Python module linked GCC's libstdc++ next to
# libc++ and segfaulted); rebuild with lhapdf-feedstock's fix.
redo:
  lhapdf: 2026-11-03T10:50:00Z
  # macOS package held only rootIO (conda-forge's hepmc3 was already in the
  # host env); rebuilt depending on hepmc3
  hepmc: 2026-11-03T16:40:00Z
