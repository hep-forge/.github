name: hep-bot ordered rebuild

# Starts a rebuild migration: <package> and everything that depends on it,
# in dependency order. This only writes migrations/<name>.yaml; hep-bot
# migrate (every 20 min) then starts each package once its dependencies in
# the migration are rebuilt, skips what is already rebuilt, and holds back
# whatever sits below a failure. Progress: migrations/status/<name>.md.
#
# A new platform for the whole channel is a migration too, with
# `platform: <leg>` instead of `from:` (see migrations/macos-arm64.yaml).

on:
  workflow_dispatch:
    inputs:
      root_package:
        description: 'Rebuild from this package and all its dependents (e.g. fastjet)'
        required: true
        default: 'fastjet'
      name:
        description: 'Migration name (default: rebuild-<package>-<date>)'
        default: ''
      dry_run:
        description: 'Only show the plan, do not create the migration'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  create:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.HEP_BOT_TOKEN }}

      - name: Install dependencies
        run: pip install pyyaml

      - name: Write the migration
        env:
          PKG: ${{ inputs.root_package }}
          NAME: ${{ inputs.name }}
        run: |
          NAME="${NAME:-rebuild-$PKG-$(date -u +%Y%m%d)}"
          echo "NAME=$NAME" >> "$GITHUB_ENV"
          mkdir -p migrations
          cat > "migrations/$NAME.yaml" <<EOF
          # Rebuild $PKG and everything that depends on it (started from hep-bot-rebuild.yml).
          name: $NAME
          created: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          from: [$PKG]
          EOF

      - name: Plan
        env:
          GH_TOKEN: ${{ secrets.HEP_BOT_TOKEN }}
        run: python3 scripts/hep_bot/migrate.py --only "$NAME" --dry-run | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commit
        if: inputs.dry_run != true
        run: |
          git config user.name "hep-bot"
          git config user.email "hep-bot@users.noreply.github.com"
          git add "migrations/$NAME.yaml"
          git commit -qm "migrations: start $NAME"
          git pull -q --rebase origin main
          git push -q origin HEAD:main
