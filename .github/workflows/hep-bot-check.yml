name: hep-bot version check

# Brings every feedstock to its latest upstream release and publishes it
# (scripts/hep_bot/check_versions.py): safe bumps are committed and tagged,
# recipes newer than their tag get tagged, everything else is listed in
# the "[hep-bot] upstream updates that need a human" issue.

on:
  schedule:
    - cron: '0 6 * * 1'   # every Monday 06:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print the plan"
        type: boolean
        default: true
      only:
        description: "Comma list of packages (empty = all)"
        required: false
        default: ''

concurrency:
  group: hep-bot-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.HEP_BOT_TOKEN }}

      - name: Configure git identity and token auth
        env:
          HEP_BOT_TOKEN: ${{ secrets.HEP_BOT_TOKEN }}
        run: |
          git config --global user.name "hep-bot"
          git config --global user.email "hep-bot@users.noreply.github.com"
          git config --global --add url."https://x-access-token:${HEP_BOT_TOKEN}@github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://x-access-token:${HEP_BOT_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Checkout feedstock submodules
        run: git submodule update --init --depth 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests pyyaml packaging

      - name: Check upstream versions
        env:
          GITHUB_TOKEN: ${{ secrets.HEP_BOT_TOKEN }}
          GH_TOKEN: ${{ secrets.HEP_BOT_TOKEN }}
          ONLY: ${{ inputs.only }}
          # Scheduled runs act; manual runs default to a dry run.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          python scripts/hep_bot/check_versions.py \
            ${ONLY:+--only "$ONLY"} $([ "$DRY_RUN" = "true" ] && echo --dry-run)
